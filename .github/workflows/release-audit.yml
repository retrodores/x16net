name: Release audit
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  audit:
    if: github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-provenance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record completed CI and release provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TEST_RESULTS: '{}'
          RECORD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 tools/record_release.py
