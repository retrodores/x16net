name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  binary:
    name: Binary / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y 64tass make
      - run: python -m pip install -r requirements-test.txt
      - name: Build, verify bindings and compare distributed binary
        run: |
          make all
          cmp build/x16net.bin bin/x16net.bin
          (cd bin && sha256sum -c SHA256SUMS)
      - name: Machine-code tests, varied deterministic seeds
        run: |
          set -o pipefail
          X16NET_SEED=1616 python t/test_binary.py | tee build/test-1616.tap
          X16NET_SEED=6502 python t/test_binary.py | tee build/test-6502.tap
          X16NET_SEED=65535 python t/test_binary.py | tee build/test-65535.tap
      - name: Reject deliberately broken binaries
        if: matrix.python == '3.12'
        run: |
          set -o pipefail
          python t/mutations.py | tee build/mutations.tap
          cmp build/x16net.bin bin/x16net.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binary-tests-python-${{ matrix.python }}
          path: |
            build/*.tap
            build/test-report.json
            build/x16net.bin
            build/x16net.labels
  prog8:
    name: Prog8 bindings / stock X16 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y 64tass make libsdl2-2.0-0 unzip
      - run: python -m pip install -r requirements-test.txt
      - run: sh tools/fetch-prog8.sh && sh tools/fetch-emulator.sh
      - name: Compile every example and build distribution
        run: make package PROG8C="$PWD/.tools/prog8c"
      - name: Load and call standalone binary from compiled Prog8
        env:
          X16EMU: ${{ github.workspace }}/.tools/x16emu-r49/x16emu
          X16ROM: ${{ github.workspace }}/.tools/x16emu-r49/rom.bin
        run: |
          set -o pipefail
          python t/run_x16_smoke.py | tee build/x16-smoke.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x16net-0.1.0
          path: |
            build/*.tar.gz
            build/*.prg
            build/x16net.bin
            build/x16net.labels
            build/*smoke.tap
