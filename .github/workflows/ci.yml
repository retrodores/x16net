name: CI
on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  binary:
    name: Binary / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y 64tass make
      - run: python -m pip install -r requirements-test.txt
      - name: Build, verify bindings and compare distributed binary
        run: |
          make all
          cmp build/x16net.bin bin/x16net.bin
          (cd bin && sha256sum -c SHA256SUMS)
      - name: Machine-code tests, varied deterministic seeds
        run: |
          set -o pipefail
          X16NET_SEED=1616 python t/test_binary.py | tee build/test-1616.tap
          X16NET_SEED=6502 python t/test_binary.py | tee build/test-6502.tap
          X16NET_SEED=65535 python t/test_binary.py | tee build/test-65535.tap
      - name: Reject deliberately broken binaries
        if: matrix.python == '3.12'
        run: |
          set -o pipefail
          python t/mutations.py | tee build/mutations.tap
          cmp build/x16net.bin bin/x16net.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binary-tests-python-${{ matrix.python }}
          path: |
            build/*.tap
            build/test-report.json
            build/x16net.bin
            build/x16net.labels
  prog8:
    name: Prog8 bindings / stock X16 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y 64tass make libsdl2-2.0-0 unzip
      - run: python -m pip install -r requirements-test.txt
      - run: sh tools/fetch-prog8.sh && sh tools/fetch-emulator.sh
      - name: Compile every example and build distribution
        run: make package PROG8C="$PWD/.tools/prog8c"
      - name: Load and call standalone binary from compiled Prog8
        env:
          X16EMU: ${{ github.workspace }}/.tools/x16emu-r49/x16emu
          X16ROM: ${{ github.workspace }}/.tools/x16emu-r49/rom.bin
        run: |
          set -o pipefail
          python t/run_x16_smoke.py | tee build/x16-smoke.tap
          python t/run_gopher_view.py | tee build/gopher-display.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x16net-build
          path: |
            build/*.tar.gz
            build/*.prg
            build/x16net.bin
            build/x16net.labels
            build/*smoke.tap
            build/gopher-display*

  network-linux:
    name: Network / Linux / compiled Prog8
    needs: prog8
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: oodler577/x16-emulator
          ref: 7ff49ec69c28cfc04ccdab1a5846d816f53f220e
          path: .tools/network-emulator
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: x16net-build
          path: build
      - run: sudo apt-get update && sudo apt-get install -y cmake libsdl2-dev zlib1g-dev
      - name: Build pinned serial-card emulator and fetch test ROM
        run: |
          cmake -S .tools/network-emulator -B .tools/network-emulator/build -DENABLE_FLUIDSYNTH=OFF -DENABLE_TRACE=OFF -DENABLE_LTO=OFF
          cmake --build .tools/network-emulator/build --parallel 4
          python3 .tools/network-emulator/tests/fetch_test_rom.py
      - name: Exercise compiled bindings and binary through host TCP
        env:
          X16EMU: ${{ github.workspace }}/.tools/network-emulator/build/x16emu
          X16ROM: ${{ github.workspace }}/build/test-rom.bin
        run: |
          set -o pipefail
          python3 t/run_network.py --fragment 256 --delay 0 | tee build/network-normal.tap
          python3 t/run_network.py --fragment 17 --delay 0.001 | tee build/network-fragmented.tap
          python3 t/run_gopher.py | tee build/gopher.tap
          python3 t/run_gopher_view.py | tee build/gopher-display.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-tests-linux
          path: |
            build/network*.tap
            build/network-emulator.log
            build/gopher.tap
            build/gopher-emulator.log
            build/gopher-display*
  network-windows:
    name: Network / Windows / compiled Prog8
    needs: prog8
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: oodler577/x16-emulator
          ref: 7ff49ec69c28cfc04ccdab1a5846d816f53f220e
          path: .tools/network-emulator
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: x16net-build
          path: build
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python
            mingw-w64-x86_64-pkgconf
      - name: Build native Windows emulator and fetch test ROM
        run: |
          cmake -S .tools/network-emulator -B .tools/network-emulator/build -G Ninja -DENABLE_FLUIDSYNTH=OFF -DENABLE_TRACE=OFF -DENABLE_LTO=OFF
          cmake --build .tools/network-emulator/build --parallel 4
          python .tools/network-emulator/tests/fetch_test_rom.py
      - name: Exercise the same compiled Prog8 program on Windows
        env:
          X16EMU: ${{ github.workspace }}/.tools/network-emulator/build/x16emu.exe
          X16ROM: ${{ github.workspace }}/build/test-rom.bin
        run: |
          set -o pipefail
          python t/run_network.py --fragment 256 --delay 0 | tee build/network-normal.tap
          python t/run_network.py --fragment 17 --delay 0.001 | tee build/network-fragmented.tap
          python t/run_gopher.py | tee build/gopher.tap
          python t/run_gopher_view.py | tee build/gopher-display.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-tests-windows
          path: |
            build/network*.tap
            build/network-emulator.log
            build/gopher.tap
            build/gopher-emulator.log
            build/gopher-display*

  release:
    name: Publish tested x16net release
    concurrency:
      group: release-provenance
      cancel-in-progress: false
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [binary, prog8, network-linux, network-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require successful tests
        env:
          TEST_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os; assert all(j["result"]=="success" for j in json.loads(os.environ["TEST_RESULTS"]).values()), "Release blocked by failed tests"'
      - uses: actions/download-artifact@v4
        with:
          name: x16net-build
          path: artifact
      - name: Assemble versioned release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          test "$RELEASE_TAG" = "v$version"
          mkdir release-assets staging
          tar -xzf "artifact/x16net-$version.tar.gz" -C staging
          cp "artifact/x16net-$version.tar.gz" release-assets/
          (cd staging && zip -qr "../release-assets/x16net-$version.zip" "x16net-$version")
          cp artifact/x16net.bin release-assets/
          cp artifact/gopher.prg release-assets/x16net-gopher.prg
          cp prog8/x16net.p8 include/x16net.inc release-assets/
          (cd release-assets && sha256sum *.bin *.prg *.p8 *.inc *.zip *.tar.gz > SHA256SUMS)
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease \
            --title "x16net $RELEASE_TAG — experimental" \
            --notes-file packaging/RELEASE-NOTES.md release-assets/*
      - name: Record publication provenance
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          TEST_RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/record_release.py
